<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Meesaikarar Silamba Koodam</title>
    <style>
        body { background:#050201; color:white; font-family: Arial, Helvetica, sans-serif; padding: 40px; }
        h1 { color:#ffb000; }
        a.logout { color:#ffb000; text-decoration:none; border:1px solid #ffb000; padding:8px 16px; border-radius:20px; }
        .grid { display:flex; gap:20px; margin-top:30px; flex-wrap:wrap; }
        .card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,174,0,0.35); border-radius:12px; padding:20px; width:220px; }
    </style>
</head>
<body>
    <h1>🥋 Admin Dashboard</h1>
    <p>Welcome, {{ username }}.</p>

    <div class="grid">
        <div class="card"><h3>👨‍🎓 Students</h3><p>Manage student records and belt levels.</p></div>
        <div class="card"><h3>📅 Attendance</h3><p>Record and review daily attendance.</p></div>
        <div class="card"><h3>🏆 Achievements</h3><p>Track student accomplishments.</p></div>
    </div>

    <p style="margin-top:40px;"><a class="logout" href="{{ url_for('logout') }}">Logout</a></p>
</body>
</html>
