<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Silambam Class Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', Arial, sans-serif;
            background:
                linear-gradient(rgba(5, 2, 1, 0.82), rgba(5, 2, 1, 0.92)),
                url("{{ url_for('static', filename='silambam-hero.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            color: white;

            position: relative;
            overflow: hidden;
        }

        /* FLOATING EMBER PARTICLES */

        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: -20px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffb000;
            box-shadow: 0 0 8px #ffb000, 0 0 16px rgba(255, 174, 0, 0.8);
            opacity: 0;
            animation: ember 7s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; animation-delay: 1.5s; }
        .particle:nth-child(3) { left: 40%; animation-delay: 3s; }
        .particle:nth-child(4) { left: 55%; animation-delay: 0.8s; }
        .particle:nth-child(5) { left: 70%; animation-delay: 2.2s; }
        .particle:nth-child(6) { left: 85%; animation-delay: 4s; }

        @keyframes ember {
            0%   { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            10%  { opacity: 0.9; }
            50%  { transform: translateY(-45vh) translateX(20px) scale(1); }
            100% { transform: translateY(-90vh) translateX(-15px) scale(0.4); opacity: 0; }
        }

        /* LOGIN CARD */

        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            position: relative;
            background: linear-gradient(
                160deg,
                rgba(255, 255, 255, 0.10),
                rgba(255, 255, 255, 0.03)
            );
            border: 1px solid rgba(255, 176, 0, 0.25);
            border-radius: 26px;
            padding: 44px 38px;

            backdrop-filter: blur(22px) saturate(150%);
            -webkit-backdrop-filter: blur(22px) saturate(150%);

            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 40px rgba(255, 176, 0, 0.06);

            text-align: center;

            animation: cardRise 0.6s ease;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 26px;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(255, 176, 0, 0.5),
                transparent 40%,
                transparent 60%,
                rgba(255, 176, 0, 0.3)
            );
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 8px;
            animation: logoGlow 2.2s infinite alternate;
        }

        @keyframes logoGlow {
            from { filter: drop-shadow(0 0 4px rgba(255, 176, 0, 0.4)); }
            to   { filter: drop-shadow(0 0 16px rgba(255, 176, 0, 0.85)); }
        }

        h1 {
            font-size: 27px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            margin-bottom: 30px;
            letter-spacing: 0.3px;
        }

        .error {
            background: rgba(220, 38, 38, 0.18);
            border: 1px solid rgba(248, 113, 113, 0.45);
            color: #ffb3b3;

            padding: 12px 16px;
            border-radius: 12px;

            margin-bottom: 22px;
            font-size: 13px;
            text-align: left;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.55);
            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 176, 0, 0.6);
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 42px;

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;

            background: rgba(0, 0, 0, 0.30);
            color: white;

            font-family: 'Poppins', sans-serif;
            font-size: 14.5px;
            outline: none;

            transition: 0.25s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        input:focus {
            border-color: rgba(255, 176, 0, 0.55);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 4px rgba(255, 176, 0, 0.08);
        }

        .login-btn {
            width: 100%;
            border: none;
            border-radius: 14px;

            padding: 15px 20px;
            margin-top: 10px;

            background: linear-gradient(135deg, #ffb000, #ff7a00);
            color: #1a1200;

            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.25s ease;

            box-shadow: 0 10px 24px rgba(255, 140, 0, 0.30);

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 140, 0, 0.42);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider-links {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.10);

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .master-link {
            color: #ffd29a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .master-link:hover {
            color: #ffb000;
        }

        .back-home {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s ease;
        }

        .back-home:hover {
            color: white;
        }

        .security-note {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);

            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 34px 24px;
                border-radius: 22px;
            }

            .logo {
                font-size: 42px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">🥋</div>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Silambam Class Management System
            </p>

            {% if error %}
                <div class="error">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                    <label for="username">Admin Username</label>

                    <div class="input-wrap">
                        <i class="fa-regular fa-user"></i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter admin username"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Admin Password</label>

                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Login <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="divider-links">

                <a href="{{ url_for('master_login') }}" class="master-link">
                    🥋 Login as Master instead
                </a>

                <a href="{{ url_for('home') }}" class="back-home">
                    ← Back to Home
                </a>

            </div>

            <div class="security-note">
                🔒 Admin access is restricted to authorized academy administrators.
            </div>

        </div>

    </div>

</body>
</html>
