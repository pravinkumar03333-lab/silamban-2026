<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Master Login</title>

</head>


<body>


    <h1>🥋 Master Login</h1>


    {% if error %}

        <p
            style="
                color: red;
            "
        >

            {{ error }}

        </p>

    {% endif %}


    <form method="POST">


        <label>

            Master Username

        </label>

        <br>


        <input
            type="text"
            name="username"
            required
        >


        <br><br>


        <label>

            Password

        </label>

        <br>


        <input
            type="password"
            name="password"
            required
        >


        <br><br>


        <button
            type="submit"
        >

            Login

        </button>


    </form>


    <br>


    <a
        href="{{ url_for('index') }}"
    >

        ← Back to Home

    </a>


</body>

</html>
